[package]
name = "reflection"
version = "0.1.0"
edition = "2024"
authors = [
  "adz <x12@adz.garden>",
  "sandreae <contact@samandreae.com>",
  "Julian Sparber <julian@sparber.net>",
]

[dependencies]
ratatui = { version = "0.27", features = ["crossterm"] }
crossterm = "0.27"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1.0.100"
loro = { tag = "loro-crdt@1.8.7", git = "https://github.com/loro-dev/loro.git" }
thiserror = "2.0.17"
test-log = { version = "0.2.18", default-features = false, features = [
  "trace",
  "color",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
rand = "0.9.2"
rand_chacha = { version = "0.9.0", features = ["os_rng"] }
hex = "0.4.3"
indexmap = "2.12.0"
chrono = { version = "0.4.42", default-features = false, features = [
  "clock",
  "serde",
] }
tokio = { version = "1.48.0", features = ["rt", "sync", "macros", "time"] }
tokio-stream = "0.1.17"
p2panda-core = { git = "https://github.com/p2panda/p2panda", rev = "a83a80b2ce0733c9437ceeaae33503d3b3742436" }
p2panda-discovery = { git = "https://github.com/p2panda/p2panda", rev = "a83a80b2ce0733c9437ceeaae33503d3b3742436", package = "p2panda-discovery-next" }
p2panda-net = { git = "https://github.com/p2panda/p2panda", rev = "a83a80b2ce0733c9437ceeaae33503d3b3742436", package = "p2panda-net-next" }
p2panda-store = { git = "https://github.com/p2panda/p2panda", rev = "a83a80b2ce0733c9437ceeaae33503d3b3742436", features = [
  "sqlite",
], default-features = false }
p2panda-stream = { git = "https://github.com/p2panda/p2panda", rev = "a83a80b2ce0733c9437ceeaae33503d3b3742436" }
p2panda-sync = { git = "https://github.com/p2panda/p2panda", rev = "a83a80b2ce0733c9437ceeaae33503d3b3742436", package = "p2panda-sync-next" }
sqlx = { version = "0.8.6", features = [
  "runtime-tokio",
  "sqlite",
  "chrono",
], default-features = false }
iroh = "0.95.1"
